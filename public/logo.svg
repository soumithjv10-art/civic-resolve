<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Outer Shield Emblem -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#143427" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26D46" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Shield -->
  <path d="M60 6 L104 22 V58 C104 84 85 106 60 114 C35 106 16 84 16 58 V22 Z" fill="url(#shieldGrad)" filter="url(#softGlow)" />
  <path d="M60 11 L99 25 V57 C99 80 82 100 60 108 C38 100 21 80 21 57 V25 Z" stroke="#E6E1D6" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Municipal Capitol Dome & Architecture -->
  <!-- Dome Top -->
  <path d="M60 30 C50 30 45 37 45 42 H75 C75 37 70 30 60 30 Z" fill="url(#accentGrad)" />
  <circle cx="60" cy="27" r="3" fill="#FAF8F5" />
  
  <!-- Arch Pediment -->
  <polygon points="41,45 79,45 60,38" fill="#FAF8F5" />
  
  <!-- Civic Pillars -->
  <rect x="44" y="47" width="5" height="22" rx="1" fill="#FAF8F5" />
  <rect x="52" y="47" width="5" height="22" rx="1" fill="#FAF8F5" />
  <rect x="63" y="47" width="5" height="22" rx="1" fill="#FAF8F5" />
  <rect x="71" y="47" width="5" height="22" rx="1" fill="#FAF8F5" />
  
  <!-- Foundation Plinth -->
  <rect x="38" y="71" width="44" height="4.5" rx="1" fill="#FAF8F5" />
  <rect x="35" y="76" width="50" height="3.5" rx="1" fill="#C85A32" />

  <!-- Central Accountability Checkmark / Seal Emblem -->
  <circle cx="60" cy="91" r="11" fill="url(#accentGrad)" />
  <path d="M55 91 L58.5 94.5 L65.5 87.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
